<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px}body{display:grid;grid-template-columns:1fr 150px}.main{background:var(--navy-600);display:grid;place-items:center}.name{font-family:var(--font-display);font-size:150px;line-height:.95;color:var(--neutral-25);text-align:center;letter-spacing:-.01em}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style></head>
<body><div class="main"><div class="name">Ordens<br>Inglesas</div></div>
<div class="strip"><div style="background:var(--gold-300)"></div><div style="background:var(--gold-500)"></div><div style="background:var(--crimson-500)"></div><div style="background:var(--crimson-700)"></div></div>
</body></html>
